<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CMS圖書館 書籤同步</title>
  <style>
    body {
      width: 260px;
      padding: 1rem;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #0369a1;
    }
    .info {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 0.65rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 1.25rem;">📚</span>
    <span class="title">CMS圖書館 書籤助手</span>
  </div>
  <div class="status-badge">
    <span>🟢</span> 原生書籤同步中
  </div>
  <a href="https://cms.thesmart.cc/libgen/" target="_blank" class="btn">📖 開啟圖書館</a>
  <div class="info">
    個人書單已自動同步至 Chrome 書籤列的「CMS圖書館」資料夾。
  </div>
</body>
</html>
